[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memreckon"
version = "0.1.0"
description = "The memory auditor for AI coding agents: re-checks remembered claims against the live repository and stamps them VERIFIED / REFUTED / STALE / UNVERIFIABLE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["ai-agents", "memory", "verification", "audit", "mcp", "claude-code", "codex"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
memreckon = "memreckon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
